<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1B2430">
<title>Ciltli</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ciltli">
<style>
  :root{
    --ink:#1B2430;
    --ink-2:#232D3B;
    --paper:#F3EAD8;
    --paper-2:#EAE0CB;
    --brass:#B98B4E;
    --brass-2:#D9AE73;
    --maroon:#6E2A38;
    --charcoal:#2A2420;
    --line:rgba(42,36,32,0.14);
    --serif: "Iowan Old Style","Palatino Linotype","URW Palladio L",Palatino,Georgia,serif;
    --sans: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--paper);
    font-family:var(--sans);
    overflow:hidden;
    position:fixed;
    inset:0;
  }
  #app{position:absolute; inset:0; display:flex; flex-direction:column;}
  button{font-family:inherit; border:none; background:none; color:inherit; cursor:pointer;}
  button:active{opacity:0.7;}
  ::selection{background:var(--brass); color:var(--ink);}

  /* ---------- LIBRARY ---------- */
  #view-library{position:absolute; inset:0; display:flex; flex-direction:column; background:
    radial-gradient(1200px 600px at 20% -10%, #263041 0%, var(--ink) 55%);
  }
  .topbar{
    padding: calc(18px + var(--safe-top)) 22px 14px;
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:1px solid rgba(255,255,255,0.07);
  }
  .brand{font-family:var(--serif); font-size:26px; letter-spacing:0.3px; color:var(--paper);}
  .brand em{font-style:italic; color:var(--brass-2);}
  .subcount{font-size:12.5px; color:rgba(243,234,216,0.5); margin-top:2px;}
  .scan-fab{
    width:46px; height:46px; border-radius:50%;
    background:var(--brass); color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 16px rgba(185,139,78,0.35);
    flex-shrink:0;
  }
  .scan-fab svg{width:22px; height:22px;}

  #shelf{flex:1; overflow-y:auto; padding:22px 20px calc(40px + var(--safe-bottom));}
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(112px,1fr));
    gap:22px 16px;
  }
  .book-card{display:flex; flex-direction:column; gap:8px; text-align:left;}
  .spine{
    position:relative; aspect-ratio:3/4.2; border-radius:3px 7px 7px 3px;
    background:linear-gradient(135deg,#3a2f2a,#241c18);
    box-shadow: -3px 0 0 rgba(0,0,0,0.35) inset, 0 10px 18px rgba(0,0,0,0.4);
    overflow:hidden;
    border:1px solid rgba(0,0,0,0.4);
  }
  .spine img{width:100%; height:100%; object-fit:cover; display:block; opacity:0.96;}
  .spine .spine-edge{position:absolute; left:0; top:0; bottom:0; width:9px; background:linear-gradient(90deg, rgba(255,255,255,0.15), rgba(0,0,0,0.25));}
  .spine .no-cover{width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:rgba(243,234,216,0.35); font-family:var(--serif); font-size:34px;}
  .book-title{font-family:var(--serif); font-size:14.5px; line-height:1.25; color:var(--paper);}
  .book-meta{font-size:11px; color:rgba(243,234,216,0.45);}

  .empty-state{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px; text-align:center; gap:18px;}
  .empty-state svg{width:88px; height:88px; opacity:0.5;}
  .empty-state h2{font-family:var(--serif); font-weight:400; font-size:21px; margin:0; color:var(--paper);}
  .empty-state p{margin:0; font-size:14px; color:rgba(243,234,216,0.55); max-width:260px; line-height:1.5;}
  .cta-btn{
    margin-top:6px; background:var(--brass); color:var(--ink); font-size:14.5px; font-weight:600;
    padding:12px 26px; border-radius:999px;
  }

  /* ---------- READER ---------- */
  #view-reader{position:absolute; inset:0; background:#0F1216; display:none; flex-direction:column;}
  #view-reader.active{display:flex;}
  .reader-top{
    padding: calc(14px + var(--safe-top)) 14px 10px; display:flex; align-items:center; gap:10px;
    background:linear-gradient(#0F1216, rgba(15,18,22,0.0));
    position:relative; z-index:5;
  }
  .icon-btn{width:38px; height:38px; display:flex; align-items:center; justify-content:center; border-radius:50%; color:var(--paper);}
  .icon-btn svg{width:20px; height:20px;}
  .reader-title{flex:1; min-width:0;}
  .reader-title .t{font-family:var(--serif); font-size:15px; color:var(--paper); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .reader-title .p{font-size:11px; color:rgba(243,234,216,0.45); margin-top:1px;}

  .stage-wrap{flex:1; position:relative; display:flex; align-items:center; justify-content:center; padding:6px 14px; overflow:hidden;}
  .book-stage{
    position:relative; width:100%; height:100%; max-width:560px;
    perspective:2400px;
  }
  .leaf{
    position:absolute; inset:0; border-radius:2px;
    box-shadow:0 18px 40px rgba(0,0,0,0.55);
    background:#e9e2d0; overflow:hidden;
  }
  .leaf img{width:100%; height:100%; object-fit:contain; background:#e9e2d0; display:block;}
  .leaf.base{z-index:1;}
  .leaf-empty{width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:rgba(0,0,0,0.3); font-family:var(--serif);}

  .flip{
    position:absolute; inset:0; transform-style:preserve-3d;
    transform-origin:left center; z-index:3; will-change:transform;
  }
  .flip .face{position:absolute; inset:0; backface-visibility:hidden; border-radius:2px; overflow:hidden; background:#e9e2d0;}
  .flip .face img{width:100%; height:100%; object-fit:contain; display:block;}
  .flip .front{transform:rotateY(0deg);}
  .flip .back{transform:rotateY(180deg);}
  .flip .shade{position:absolute; inset:0; background:linear-gradient(90deg, rgba(0,0,0,0.28), rgba(0,0,0,0) 40%); opacity:0; pointer-events:none;}

  .tap-zone{position:absolute; top:0; bottom:0; width:26%; z-index:4;}
  .tap-zone.left{left:0;}
  .tap-zone.right{right:0;}

  .reader-bottom{padding:10px 16px calc(14px + var(--safe-bottom)); display:flex; align-items:center; justify-content:center; gap:18px;}
  .dot-track{font-size:11.5px; color:rgba(243,234,216,0.5); letter-spacing:0.5px;}
  .add-page-btn{
    display:flex; align-items:center; gap:8px; background:rgba(185,139,78,0.16); color:var(--brass-2);
    border:1px solid rgba(185,139,78,0.4); padding:9px 18px; border-radius:999px; font-size:13px; font-weight:600;
  }
  .add-page-btn svg{width:15px; height:15px;}

  /* ---------- SCAN ---------- */
  #view-scan{position:absolute; inset:0; background:#000; display:none; flex-direction:column; z-index:20;}
  #view-scan.active{display:flex;}
  .scan-top{
    padding: calc(14px + var(--safe-top)) 16px 10px; display:flex; align-items:center; justify-content:space-between; color:var(--paper); z-index:2;
  }
  .scan-top .count{font-size:13px; color:rgba(243,234,216,0.65);}
  .camera-wrap{flex:1; position:relative; background:#111; overflow:hidden;}
  #camVideo{width:100%; height:100%; object-fit:cover; display:block;}
  .cam-fallback{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; padding:30px; text-align:center; color:rgba(243,234,216,0.7);}
  .guide-frame{position:absolute; inset:6% 5%; border:1.5px dashed rgba(243,234,216,0.55); border-radius:8px; pointer-events:none;}
  .scan-bottom{padding:22px 20px calc(26px + var(--safe-bottom)); display:flex; align-items:center; justify-content:center; gap:36px;}
  .shutter{
    width:70px; height:70px; border-radius:50%; background:var(--paper); border:4px solid rgba(243,234,216,0.35);
  }
  .side-btn{width:44px; height:44px; border-radius:50%; background:rgba(255,255,255,0.1); color:var(--paper); display:flex; align-items:center; justify-content:center;}
  .side-btn svg{width:20px; height:20px;}
  input#galleryInput{display:none;}

  /* ---------- CROP ---------- */
  #view-crop{position:absolute; inset:0; background:#0B0D10; display:none; flex-direction:column; z-index:21;}
  #view-crop.active{display:flex;}
  .crop-top{padding: calc(14px + var(--safe-top)) 16px 8px; display:flex; justify-content:space-between; color:var(--paper);}
  .crop-top button{font-size:14px; color:var(--brass-2); font-weight:600;}
  .crop-stage{flex:1; position:relative; display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .crop-canvas-wrap{position:relative; touch-action:none;}
  #cropImg{max-width:100%; max-height:100%; display:block; user-select:none; -webkit-user-drag:none;}
  .handle{position:absolute; width:26px; height:26px; margin:-13px; border-radius:50%; background:rgba(217,174,115,0.9); border:2px solid #fff; touch-action:none;}
  .crop-rect{position:absolute; border:2px solid var(--brass-2); box-shadow:0 0 0 2000px rgba(0,0,0,0.45);}
  .filters-row{display:flex; gap:10px; padding:14px 16px; overflow-x:auto;}
  .filter-chip{flex-shrink:0; padding:8px 16px; border-radius:999px; font-size:12.5px; background:rgba(255,255,255,0.08); color:rgba(243,234,216,0.7); border:1px solid transparent;}
  .filter-chip.on{background:rgba(185,139,78,0.2); color:var(--brass-2); border-color:rgba(185,139,78,0.5);}
  .crop-bottom{padding:6px 20px calc(24px + var(--safe-bottom)); display:flex; gap:12px;}
  .btn-outline{flex:1; padding:13px; border-radius:12px; border:1px solid rgba(243,234,216,0.25); color:var(--paper); font-size:14px;}
  .btn-solid{flex:1.4; padding:13px; border-radius:12px; background:var(--brass); color:var(--ink); font-size:14px; font-weight:700;}

  /* ---------- MISC ---------- */
  .sheet-mask{position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:30; display:none; align-items:flex-end;}
  .sheet-mask.active{display:flex;}
  .sheet{background:var(--paper-2); color:var(--charcoal); width:100%; border-radius:18px 18px 0 0; padding:20px 20px calc(20px + var(--safe-bottom));}
  .sheet h3{margin:0 0 14px; font-family:var(--serif); font-weight:400; font-size:17px;}
  .sheet input[type=text]{width:100%; padding:12px; border-radius:10px; border:1px solid var(--line); font-size:15px; font-family:inherit; background:#fff;}
  .sheet-actions{display:flex; gap:10px; margin-top:16px;}
  .sheet-actions button{flex:1; padding:12px; border-radius:10px; font-size:14px;}
  .sheet-actions .save{background:var(--ink); color:var(--paper); font-weight:600;}
  .sheet-actions .cancel{background:rgba(0,0,0,0.06);}
  .sheet-actions .danger{background:var(--maroon); color:#fff; font-weight:600;}

  .toast{position:fixed; left:50%; bottom:calc(30px + var(--safe-bottom)); transform:translateX(-50%); background:rgba(20,20,20,0.92); color:#fff; padding:10px 18px; border-radius:999px; font-size:13px; z-index:60; opacity:0; pointer-events:none; transition:opacity .25s;}
  .toast.show{opacity:1;}

  @media (prefers-reduced-motion: reduce){
    .flip{transition:none !important;}
  }
</style>
</head>
<body>
<div id="app">

  <!-- LIBRARY -->
  <div id="view-library">
    <div class="topbar">
      <div>
        <div class="brand">Cilt<em>li</em></div>
        <div class="subcount" id="shelfCount">Kütüphane boş</div>
      </div>
      <button class="scan-fab" id="btnNewBook" aria-label="Yeni kitap tara">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <div id="shelf">
      <div class="grid" id="grid"></div>
    </div>
  </div>

  <!-- READER -->
  <div id="view-reader">
    <div class="reader-top">
      <button class="icon-btn" id="btnBackLib" aria-label="Kütüphaneye dön">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="reader-title">
        <div class="t" id="readerTitle">—</div>
        <div class="p" id="readerPage">—</div>
      </div>
      <button class="icon-btn" id="btnBookMenu" aria-label="Kitap seçenekleri">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
      </button>
    </div>
    <div class="stage-wrap">
      <div class="book-stage" id="bookStage">
        <div class="leaf base" id="baseLeaf"><div class="leaf-empty">Sayfa yok</div></div>
        <div class="tap-zone left" id="zoneLeft"></div>
        <div class="tap-zone right" id="zoneRight"></div>
      </div>
    </div>
    <div class="reader-bottom">
      <button class="add-page-btn" id="btnAddPage">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Sayfa ekle
      </button>
    </div>
  </div>

  <!-- SCAN (camera) -->
  <div id="view-scan">
    <div class="scan-top">
      <button class="icon-btn" id="btnScanClose" aria-label="Kapat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div class="count" id="scanCount">0 sayfa tarandı</div>
      <div style="width:38px;"></div>
    </div>
    <div class="camera-wrap">
      <video id="camVideo" autoplay playsinline muted></video>
      <div class="guide-frame" id="guideFrame"></div>
      <div class="cam-fallback" id="camFallback" style="display:none;">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7l1.5-3h5L16 7"/><circle cx="12" cy="13.5" r="3.4"/></svg>
        <div>Kamera açılamadı. Galeriden seçebilirsin.</div>
      </div>
    </div>
    <div class="scan-bottom">
      <button class="side-btn" id="btnGallery" aria-label="Galeriden seç">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      </button>
      <button class="shutter" id="btnShutter" aria-label="Fotoğraf çek"></button>
      <button class="side-btn" id="btnScanDone" aria-label="Bitir">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
      </button>
    </div>
    <input type="file" id="galleryInput" accept="image/*" capture="environment" multiple>
  </div>

  <!-- CROP -->
  <div id="view-crop">
    <div class="crop-top">
      <button id="btnCropCancel">Vazgeç</button>
      <button id="btnCropRotate" aria-label="Döndür">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
      </button>
    </div>
    <div class="crop-stage">
      <div class="crop-canvas-wrap" id="cropWrap">
        <img id="cropImg" alt="">
        <div class="crop-rect" id="cropRect"></div>
        <div class="handle" id="hTL"></div>
        <div class="handle" id="hTR"></div>
        <div class="handle" id="hBL"></div>
        <div class="handle" id="hBR"></div>
      </div>
    </div>
    <div class="filters-row">
      <button class="filter-chip on" data-filter="none">Orijinal</button>
      <button class="filter-chip" data-filter="bw">Siyah-Beyaz Tarama</button>
      <button class="filter-chip" data-filter="enhance">Netleştir</button>
    </div>
    <div class="crop-bottom">
      <button class="btn-outline" id="btnCropSkip">Kırpmadan kaydet</button>
      <button class="btn-solid" id="btnCropSave">Sayfayı kaydet</button>
    </div>
  </div>

</div>

<!-- Bottom sheet (rename / delete) -->
<div class="sheet-mask" id="sheetMask">
  <div class="sheet">
    <h3 id="sheetTitle">Kitap adı</h3>
    <input type="text" id="bookNameInput" placeholder="ör. Fizik Ders Notları">
    <div class="sheet-actions">
      <button class="cancel" id="sheetCancel">Vazgeç</button>
      <button class="save" id="sheetSave">Kaydet</button>
    </div>
    <div class="sheet-actions" id="deleteRow" style="display:none;">
      <button class="danger" id="sheetDelete" style="width:100%;">Kitabı sil</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* ============ INDEXEDDB ============ */
const DB_NAME = "ciltli-db", DB_VER = 1;
let db;
function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = (e)=>{
      const d = e.target.result;
      if(!d.objectStoreNames.contains("books")){
        d.createObjectStore("books",{keyPath:"id"});
      }
      if(!d.objectStoreNames.contains("pages")){
        const s = d.createObjectStore("pages",{keyPath:"id"});
        s.createIndex("bookId","bookId",{unique:false});
      }
    };
    req.onsuccess = ()=>{ db = req.result; resolve(db); };
    req.onerror = ()=> reject(req.error);
  });
}
function tx(store, mode){ return db.transaction(store, mode).objectStore(store); }
function idbGetAll(store){
  return new Promise((res,rej)=>{
    const r = tx(store,"readonly").getAll();
    r.onsuccess = ()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
function idbGetAllByIndex(store, index, key){
  return new Promise((res,rej)=>{
    const r = tx(store,"readonly").index(index).getAll(key);
    r.onsuccess = ()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
function idbPut(store, val){
  return new Promise((res,rej)=>{
    const r = tx(store,"readwrite").put(val);
    r.onsuccess = ()=>res(val); r.onerror=()=>rej(r.error);
  });
}
function idbDelete(store, key){
  return new Promise((res,rej)=>{
    const r = tx(store,"readwrite").delete(key);
    r.onsuccess = ()=>res(); r.onerror=()=>rej(r.error);
  });
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

/* ============ STATE ============ */
let books = [];           // {id,title,createdAt}
let pagesByBook = {};      // bookId -> [{id,bookId,order,blob}]
let currentBookId = null;
let currentIndex = 0;
let scanTargetBookId = null;
let pendingCropBlob = null;
let activeFilter = "none";
let stream = null;

const $ = (sel)=>document.querySelector(sel);
const els = {
  viewLibrary: $("#view-library"), viewReader: $("#view-reader"),
  viewScan: $("#view-scan"), viewCrop: $("#view-crop"),
  grid: $("#grid"), shelfCount: $("#shelfCount"),
  readerTitle: $("#readerTitle"), readerPage: $("#readerPage"),
  bookStage: $("#bookStage"), baseLeaf: $("#baseLeaf"),
  camVideo: $("#camVideo"), camFallback: $("#camFallback"), guideFrame: $("#guideFrame"),
  scanCount: $("#scanCount"), galleryInput: $("#galleryInput"),
  cropImg: $("#cropImg"), cropWrap: $("#cropWrap"), cropRect: $("#cropRect"),
  sheetMask: $("#sheetMask"), sheetTitle: $("#sheetTitle"), bookNameInput: $("#bookNameInput"),
  deleteRow: $("#deleteRow"), toast: $("#toast")
};

function toast(msg){
  els.toast.textContent = msg;
  els.toast.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>els.toast.classList.remove("show"), 1800);
}

/* ============ VIEW SWITCH ============ */
function showView(name){
  els.viewLibrary.style.display = name==="library" ? "flex" : "none";
  els.viewReader.classList.toggle("active", name==="reader");
  els.viewScan.classList.toggle("active", name==="scan");
  els.viewCrop.classList.toggle("active", name==="crop");
  if(name!=="scan") stopCamera();
}

/* ============ LOAD & RENDER LIBRARY ============ */
async function loadLibrary(){
  books = await idbGetAll("books");
  books.sort((a,b)=>b.createdAt-a.createdAt);
  pagesByBook = {};
  for(const b of books){
    const pages = await idbGetAllByIndex("pages","bookId",b.id);
    pages.sort((a,b2)=>a.order-b2.order);
    pagesByBook[b.id] = pages;
  }
  renderLibrary();
}

let libraryCoverUrls = [];
function renderLibrary(){
  libraryCoverUrls.forEach(u=>URL.revokeObjectURL(u));
  libraryCoverUrls = [];
  els.grid.innerHTML = "";
  if(books.length === 0){
    els.shelfCount.textContent = "Kütüphane boş";
    els.grid.innerHTML = "";
    const empty = document.createElement("div");
    empty.className = "empty-state";
    empty.style.gridColumn = "1/-1";
    empty.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M3 5.5C3 4.7 3.7 4 5 4c3 0 5.5 1 7 2.5V19C10.5 17.5 8 16.5 5 16.5c-1.3 0-2 .7-2 1.5V5.5Z"/><path d="M21 5.5c0-.8-.7-1.5-2-1.5-3 0-5.5 1-7 2.5V19c1.5-1.5 4-2.5 7-2.5 1.3 0 2 .7 2 1.5V5.5Z"/></svg>
      <h2>Raf henüz boş</h2>
      <p>İlk kitabını tara: sayfaları fotoğrafla, kırp, kütüphanene ekle. Her şey telefonunda kalır.</p>
      <button class="cta-btn" id="btnEmptyScan">İlk kitabı tara</button>`;
    els.grid.parentElement.appendChild(empty);
    empty.querySelector("#btnEmptyScan").addEventListener("click", startNewBookFlow);
    return;
  }
  const stale = els.grid.parentElement.querySelector(".empty-state");
  if(stale) stale.remove();
  els.shelfCount.textContent = books.length + (books.length===1 ? " kitap" : " kitap");
  for(const b of books){
    const pages = pagesByBook[b.id] || [];
    const card = document.createElement("button");
    card.className = "book-card";
    const coverUrl = pages[0] ? URL.createObjectURL(pages[0].blob) : null;
    if(coverUrl) libraryCoverUrls.push(coverUrl);
    card.innerHTML = `
      <div class="spine">
        <div class="spine-edge"></div>
        ${coverUrl ? `<img src="${coverUrl}" alt="">` : `<div class="no-cover">${(b.title||"?").charAt(0).toUpperCase()}</div>`}
      </div>
      <div class="book-title">${escapeHtml(b.title || "Adsız kitap")}</div>
      <div class="book-meta">${pages.length} sayfa</div>`;
    card.addEventListener("click", ()=>openBook(b.id));
    els.grid.appendChild(card);
  }
}
function escapeHtml(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

/* ============ READER ============ */
function openBook(bookId){
  currentBookId = bookId;
  currentIndex = 0;
  const book = books.find(b=>b.id===bookId);
  els.readerTitle.textContent = book ? book.title : "Kitap";
  showView("reader");
  renderPage();
}

function currentPages(){ return pagesByBook[currentBookId] || []; }

let lastBaseUrl = null;
function setBaseLeaf(url){
  if(lastBaseUrl) URL.revokeObjectURL(lastBaseUrl);
  lastBaseUrl = url;
}

function renderPage(){
  const pages = currentPages();
  const book = books.find(b=>b.id===currentBookId);
  els.readerTitle.textContent = book ? book.title : "";
  if(pages.length === 0){
    els.baseLeaf.innerHTML = `<div class="leaf-empty">Bu kitapta henüz sayfa yok</div>`;
    els.readerPage.textContent = "0 / 0";
    return;
  }
  currentIndex = Math.max(0, Math.min(currentIndex, pages.length-1));
  const url = URL.createObjectURL(pages[currentIndex].blob);
  setBaseLeaf(url);
  els.baseLeaf.innerHTML = `<img src="${url}" alt="Sayfa ${currentIndex+1}">`;
  els.readerPage.textContent = (currentIndex+1) + " / " + pages.length;
}

function flipTo(direction){
  const pages = currentPages();
  if(pages.length === 0) return;
  const targetIndex = currentIndex + direction;
  if(targetIndex < 0 || targetIndex >= pages.length) return;
  if(document.querySelector(".flip")) return; // animation in progress

  const flip = document.createElement("div");
  flip.className = "flip";
  const stage = els.bookStage;

  if(direction === 1){
    const curUrl = URL.createObjectURL(pages[currentIndex].blob);
    const nextUrl = URL.createObjectURL(pages[targetIndex].blob);
    flip.innerHTML = `
      <div class="face front"><img src="${curUrl}"></div>
      <div class="face back"><img src="${nextUrl}"></div>
      <div class="shade"></div>`;
    flip.style.transform = "rotateY(0deg)";
    stage.appendChild(flip);
    setBaseLeaf(nextUrl);
    els.baseLeaf.innerHTML = `<img src="${nextUrl}">`; // ready underneath
    requestAnimationFrame(()=>{
      flip.style.transition = "transform 480ms cubic-bezier(.4,.1,.2,1)";
      flip.querySelector(".shade").style.transition = "opacity 480ms";
      flip.style.transform = "rotateY(-180deg)";
      flip.querySelector(".shade").style.opacity = "0.9";
    });
    flip.addEventListener("transitionend", function done(e){
      if(e.propertyName !== "transform") return;
      flip.removeEventListener("transitionend", done);
      flip.remove();
      URL.revokeObjectURL(curUrl);
      currentIndex = targetIndex;
      els.readerPage.textContent = (currentIndex+1) + " / " + pages.length;
    });
  } else {
    const prevUrl = URL.createObjectURL(pages[targetIndex].blob);
    const curUrl = URL.createObjectURL(pages[currentIndex].blob);
    flip.innerHTML = `
      <div class="face front"><img src="${prevUrl}"></div>
      <div class="face back"><img src="${curUrl}"></div>
      <div class="shade"></div>`;
    flip.style.transform = "rotateY(-180deg)";
    flip.querySelector(".shade").style.opacity = "0.9";
    stage.appendChild(flip);
    requestAnimationFrame(()=>{
      flip.style.transition = "transform 480ms cubic-bezier(.4,.1,.2,1)";
      flip.querySelector(".shade").style.transition = "opacity 480ms";
      flip.style.transform = "rotateY(0deg)";
      flip.querySelector(".shade").style.opacity = "0";
    });
    flip.addEventListener("transitionend", function done(e){
      if(e.propertyName !== "transform") return;
      flip.removeEventListener("transitionend", done);
      flip.remove();
      currentIndex = targetIndex;
      setBaseLeaf(prevUrl);
      els.baseLeaf.innerHTML = `<img src="${prevUrl}">`;
      URL.revokeObjectURL(curUrl);
      els.readerPage.textContent = (currentIndex+1) + " / " + pages.length;
    });
  }
}

$("#zoneRight").addEventListener("click", ()=>flipTo(1));
$("#zoneLeft").addEventListener("click", ()=>flipTo(-1));
$("#btnBackLib").addEventListener("click", ()=>{ showView("library"); loadLibrary(); });

/* swipe support */
(function(){
  let startX=null, startY=null;
  els.bookStage.addEventListener("touchstart",(e)=>{
    startX = e.touches[0].clientX; startY = e.touches[0].clientY;
  },{passive:true});
  els.bookStage.addEventListener("touchend",(e)=>{
    if(startX===null) return;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)){
      flipTo(dx < 0 ? 1 : -1);
    }
    startX=null; startY=null;
  },{passive:true});
})();

/* ============ BOOK MENU (rename/delete) ============ */
$("#btnBookMenu").addEventListener("click", ()=>{
  const book = books.find(b=>b.id===currentBookId);
  els.sheetTitle.textContent = "Kitap ayarları";
  els.bookNameInput.value = book ? book.title : "";
  els.deleteRow.style.display = "flex";

});

$("#sheetSave").addEventListener("click", async ()=>{

$("#sheetDelete").addEventListener("click", async ()=>{
  if(!currentBookId) return;
  const pages = await idbGetAllByIndex("pages","bookId",currentBookId);
  for(const p of pages) await idbDelete("pages", p.id);
  await idbDelete("books", currentBookId);
  els.sheetMask.classList.remove("active");

  await loadLibrary();
  toast("Kitap silindi");
});

/* ============ NEW BOOK / SCAN FLOW ============ */
let pendingNewBookId = null;
$("#btnNewBook").addEventListener("click", startNewBookFlow);
function startNewBookFlow(){
  els.sheetTitle.textContent = "Yeni kitap";
  els.bookNameInput.value = "";
  els.deleteRow.style.display = "none";
  pendingNewBookId = null;
  els.sheetMask.classList.add("active");

originalSave.addEventListener("click", async ()=>{

async function openScanner(bookId){
  scanTargetBookId = bookId;
  showView("scan");
  updateScanCount();
  await startCamera();
}
function updateScanCount(){
  const n = (pagesByBook[scanTargetBookId] || []).length;
  els.scanCount.textContent = n + (n===1 ? " sayfa tarandı" : " sayfa tarandı");
}

$("#btnScanClose").addEventListener("click", async ()=>{
  showView("library");
  await loadLibrary();
});
$("#btnScanDone").addEventListener("click", async ()=>{
  if(currentBookId === scanTargetBookId || els.viewReader.classList.contains("active")){

/* ---- camera ---- */
async function startCamera(){
  els.camFallback.style.display = "none";
  els.camVideo.style.display = "block";
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ideal:"environment"}, width:{ideal:1920}, height:{ideal:1080} },
      audio:false
    });
    els.camVideo.srcObject = stream;
  }catch(err){
    els.camVideo.style.display = "none";
    els.camFallback.style.display = "flex";
  }
}
function stopCamera(){
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream = null; }
}

$("#btnShutter").addEventListener("click", ()=>{
  if(!stream){ els.galleryInput.click(); return; }
  const video = els.camVideo;
  const canvas = document.createElement("canvas");
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  const ctx = canvas.getContext("2d");
  ctx.drawImage(video, 0, 0);
  canvas.toBlob((blob)=>{ openCrop(blob); }, "image/jpeg", 0.92);
});
$("#btnGallery").addEventListener("click", ()=> els.galleryInput.click());
els.galleryInput.addEventListener("change", (e)=>{
  const files = Array.from(e.target.files || []);
  if(files.length) openCrop(files[0]);
  els.galleryInput.value = "";
});

/* ============ CROP ============ */
let cropBox = {x:0.08,y:0.05,w:0.84,h:0.9}; // relative to image render size
let cropRotation = 0;

function openCrop(blob){
  pendingCropBlob = blob;
  cropRotation = 0;
  const url = URL.createObjectURL(blob);
  els.cropImg.src = url;
  activeFilter = "none";
  document.querySelectorAll(".filter-chip").forEach(c=>c.classList.toggle("on", c.dataset.filter==="none"));
  showView("crop");
  els.cropImg.onload = ()=>{
    cropBox = {x:0.06,y:0.04,w:0.88,h:0.92};
    layoutCropHandles();
  };
}

function layoutCropHandles(){
  const rect = els.cropImg.getBoundingClientRect();
  const wrapRect = els.cropWrap.getBoundingClientRect();
  const left = rect.left - wrapRect.left, top = rect.top - wrapRect.top;
  const x = left + cropBox.x*rect.width, y = top + cropBox.y*rect.height;
  const w = cropBox.w*rect.width, h = cropBox.h*rect.height;
  els.cropRect.style.left = x+"px"; els.cropRect.style.top = y+"px";
  els.cropRect.style.width = w+"px"; els.cropRect.style.height = h+"px";
  $("#hTL").style.left=x+"px"; $("#hTL").style.top=y+"px";
  $("#hTR").style.left=(x+w)+"px"; $("#hTR").style.top=y+"px";
  $("#hBL").style.left=x+"px"; $("#hBL").style.top=(y+h)+"px";
  $("#hBR").style.left=(x+w)+"px"; $("#hBR").style.top=(y+h)+"px";
}
window.addEventListener("resize", ()=>{ if(els.viewCrop.classList.contains("active")) layoutCropHandles(); });

function makeDraggable(handle, corner){
  handle.addEventListener("pointerdown",(e)=>{
    e.preventDefault();
    handle.setPointerCapture(e.pointerId);
    const move = (ev)=>{
      const rect = els.cropImg.getBoundingClientRect();
      const wrapRect = els.cropWrap.getBoundingClientRect();
      let px = (ev.clientX - (rect.left - wrapRect.left) - wrapRect.left) ;
      let relX = (ev.clientX - rect.left) / rect.width;
      let relY = (ev.clientY - rect.top) / rect.height;
      relX = Math.max(0, Math.min(1, relX));
      relY = Math.max(0, Math.min(1, relY));
      const minSize = 0.08;
      if(corner === "tl"){
        cropBox.w = Math.max(minSize, cropBox.x + cropBox.w - relX);
        cropBox.h = Math.max(minSize, cropBox.y + cropBox.h - relY);
        cropBox.x = Math.min(relX, cropBox.x + cropBox.w - minSize);
        cropBox.y = Math.min(relY, cropBox.y + cropBox.h - minSize);
      } else if(corner === "tr"){
        cropBox.w = Math.max(minSize, relX - cropBox.x);
        cropBox.h = Math.max(minSize, cropBox.y + cropBox.h - relY);
        cropBox.y = Math.min(relY, cropBox.y + cropBox.h - minSize);
      } else if(corner === "bl"){
        cropBox.w = Math.max(minSize, cropBox.x + cropBox.w - relX);
        cropBox.x = Math.min(relX, cropBox.x + cropBox.w - minSize);
        cropBox.h = Math.max(minSize, relY - cropBox.y);
      } else if(corner === "br"){
        cropBox.w = Math.max(minSize, relX - cropBox.x);
        cropBox.h = Math.max(minSize, relY - cropBox.y);
      }
      layoutCropHandles();
    };
    const up = (ev)=>{
      handle.releasePointerCapture(e.pointerId);
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
    };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
  });
}
makeDraggable($("#hTL"),"tl"); makeDraggable($("#hTR"),"tr");
makeDraggable($("#hBL"),"bl"); makeDraggable($("#hBR"),"br");

document.querySelectorAll(".filter-chip").forEach(chip=>{
  chip.addEventListener("click", ()=>{
    activeFilter = chip.dataset.filter;
    document.querySelectorAll(".filter-chip").forEach(c=>c.classList.toggle("on", c===chip));
  });
});

$("#btnCropRotate").addEventListener("click", ()=>{
  cropRotation = (cropRotation + 90) % 360;
  els.cropImg.style.transform = `rotate(${cropRotation}deg)`;
  els.cropImg.style.maxWidth = (cropRotation%180===0) ? "100%" : "70%";
  els.cropImg.style.maxHeight = (cropRotation%180===0) ? "100%" : "70%";
  cropBox = {x:0.06,y:0.04,w:0.88,h:0.92};
  requestAnimationFrame(layoutCropHandles);
});

$("#btnCropCancel").addEventListener("click", ()=>{
  showView("scan");
});

function filterString(){
  if(activeFilter === "bw") return "grayscale(1) contrast(1.35) brightness(1.12)";
  if(activeFilter === "enhance") return "contrast(1.2) saturate(1.08) brightness(1.05)";
  return "none";
}

async function processCrop(useCropBox){
  const img = await createImageBitmap(pendingCropBlob);
  let srcW = img.width, srcH = img.height;
  const canvas = document.createElement("canvas");
  const rotated = cropRotation % 180 !== 0;
  const outW = rotated ? srcH : srcW;
  const outH = rotated ? srcW : srcH;
  const rotCanvas = document.createElement("canvas");
  rotCanvas.width = outW; rotCanvas.height = outH;
  const rctx = rotCanvas.getContext("2d");
  rctx.translate(outW/2, outH/2);
  rctx.rotate(cropRotation * Math.PI/180);
  rctx.drawImage(img, -srcW/2, -srcH/2);

  let sx=0, sy=0, sw=outW, sh=outH;
  if(useCropBox){
    sx = cropBox.x * outW; sy = cropBox.y * outH;
    sw = cropBox.w * outW; sh = cropBox.h * outH;
  }
  canvas.width = sw; canvas.height = sh;
  const ctx = canvas.getContext("2d");
  ctx.filter = filterString();
  ctx.drawImage(rotCanvas, sx, sy, sw, sh, 0, 0, sw, sh);

  return new Promise((resolve)=>{
    canvas.toBlob((blob)=>resolve(blob), "image/jpeg", 0.9);
  });
}

async function saveCroppedPage(useCropBox){
  const blob = await processCrop(useCropBox);
  const pages = pagesByBook[scanTargetBookId] || [];
  const page = {id: uid(), bookId: scanTargetBookId, order: pages.length, blob};
  await idbPut("pages", page);
  pages.push(page);
  pagesByBook[scanTargetBookId] = pages;
  updateScanCount();
  toast("Sayfa kaydedildi");
  showView("scan");
  await startCamera();
}
$("#btnCropSave").addEventListener("click", ()=> saveCroppedPage(true));
$("#btnCropSkip").addEventListener("click", ()=> saveCroppedPage(false));
